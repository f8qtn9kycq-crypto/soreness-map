:root[data-theme="dark"]{--bg:#121c1e;--card:#1b2a2d;--ink:#e6eff0;--mut:#9bb0b5;--line:#33484d;--acc:#5fc0c8;--accT:#0b1d20;--sil:#223437}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:12px 14px 120px}
h1{font-size:22px;margin:4px 0}h2{font-size:20px;margin:0 0 4px}
.top,.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mut,label{color:var(--mut);font-size:14px}
label{display:block;margin:8px 0 4px}
button{font:inherit;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:48px;padding:0 14px}
button.pri,button.on{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.4}
.seg{display:flex;gap:6px}.seg button{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
svg.body{width:100%;max-width:340px;display:block;margin:0 auto}
.p{cursor:pointer;stroke:var(--mut);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-dasharray:3 3;fill:var(--card);fill-opacity:.3}
.ro{pointer-events:none}
.p.has{stroke-dasharray:none;stroke:var(--ink);fill-opacity:.92}
g[data-k]:focus-visible{outline:3px solid var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;min-height:58px;background:none;color:var(--mut)}
nav button.on{background:none;color:var(--acc);border-top:3px solid var(--acc)}
.veil{position:fixed;inset:0;background:#0006;z-index:19}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px #0005}
.sev{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.sev button{padding:0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
input,textarea,select{font:inherit;width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);color:var(--ink)}
.rw{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.dot{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#111}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px}
small{color:var(--mut)}
</style></head>

return `<select id="sm"><option value="draft">${i('draft')}</option>${[...S.entries].reverse().map(x=>`<option value="${x.id}" ${x.id==S.sumId?'selected':''}>${x.date} ${esc(x.workout)}</option>`).join('')}</select>
<div class="card"><div class="row"><b>${e.date}</b><span>${esc(e.workout)}</span></div><div class="row"><div style="flex:1">${body('F',e.parts)}<p class="mut" style="text-align:center;margin:0">${i('front')}</p></div><div style="flex:1">${body('B',e.parts)}<p class="mut" style="text-align:center;margin:0">${i('back')}</p></div></div>${rows||`<p class="mut">${i('none')}</p>`}</div><p class="mut">${i('shot')}</p>`}
function trend(){const t1=Date.now(),t0=t1-S.range*864e5,X=d=>24+Math.max(0,(new Date(d)-t0)/(t1-t0))*290,Y=s=>150-s*13;
const pts=S.entries.filter(e=>new Date(e.date)>=t0-864e5).map(e=>({d:e.date,s:(e.parts[S.tp]||{}).s||0}));
const g=[0,5,10].map(v=>`<line x1="24" x2="316" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="18" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mut)">${v}</text>`).join('');
const ch=pts.length?`<svg viewBox="0 0 330 185" style="width:100%">${g}<polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${pts.map(p=>X(p.d)+','+Y(p.s)).join(' ')}"/>${pts.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.s)}" r="6" fill="${p.s?col(p.s):'var(--mut)'}" stroke="var(--ink)"/>`).join('')}<text x="24" y="176" font-size="11" fill="var(--mut)">${new Date(t0).toISOString().slice(5,10)}</text><text x="316" y="176" text-anchor="end" font-size="11" fill="var(--mut)">${today().slice(5)}</text></svg>`:`<p class="mut">${i('empty')}</p>`;
return `<label>${i('part')}</label><select id="tp">${[['muscles',KS.filter(k=>!isJ(k))],['joints',KS.filter(isJ)]].map(([g,a])=>`<optgroup label="${i(g)}">${a.map(k=>`<option value="${k}" ${k==S.tp?'selected':''}>${name(k)}</option>`).join('')}</optgroup>`).join('')}</select>
<div class="seg" style="margin-top:8px">${[7,30,90].map(n=>`<button data-a="rg" data-v="${n}" class="${S.range==n?'on':''}">${n} ${i('days')}</button>`).join('')}</div><div class="card">${ch}</div>
<div class="card"><b>${i('hist')} (${S.entries.length})</b>${[...S.entries].reverse().map(e=>`<div class="rw" style="align-items:center"><div style="flex:1">${e.date} ${esc(e.workout)}<br><small>${active(e.parts).length} ${i('parts')}</small></div><button data-a="del" data-v="${e.id}">${S.cf==e.id?i('cf'):i('del')}</button></div>`).join('')}</div>
<div class="card"><div class="row">${S.dl?`<button data-a="exj" style="flex:1">${i('exp')} JSON</button><button data-a="exc" style="flex:1">${i('exp')} CSV</button>`:''}<button data-a="imp" style="flex:1">${i('imp')}</button></div>${S.dl?'':`<p class="mut">${i('nodl')}</p>`}<input type="file" id="fi" accept=".json,application/json" hidden></div>`}
function render(){const v={rec,trend,sum}[S.tab]();document.documentElement.lang=S.lang=='zh'?'zh-Hant':'en';
document.getElementById('app').innerHTML=(S.msg?`<div class="toast">${S.msg}</div>`:'')+`<div class="top"><h1>${i('title')}</h1><button data-a="lang">${S.lang=='zh'?'EN':'中文'}</button></div>`+`<p class="mut" style="font-size:12px">資料留在此瀏覽器，匯出檔案由你保管。本工具僅供記錄，非診斷或治療建議。<br>Data stays in this browser; you control exported files. For logging only; not diagnosis or treatment advice.</p>`+`<div id="storage-status">${storageWarning()}</div>`+v+`<nav>${['rec','trend','sum'].map(t=>`<button data-a="tab" data-v="${t}" class="${S.tab==t?'on':''}">${i(t)}</button>`).join('')}</nav>`+(S.sel?sheet():'')}
function toast(m){S.msg=m;render();setTimeout(()=>{S.msg='';render()},2200)}
function setP(k,f){const d=S.draft.parts[k]||(S.draft.parts[k]={s:0,t:[],n:''});f(d);if(!d.s)delete S.draft.parts[k];persist()}
const csvCell=value=>{let text=String(value);if(/^[\s\uFEFF]*[=+@-]|^[\t\r\n]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"'};
async function exp(kind){const day=today();let data,fn;
if(kind=='d'){data=JSON.stringify({v:1,entries:[{id:Date.now(),date:S.draft.date,workout:S.draft.workout,parts:S.draft.parts}]},null,1);fn=`soreness-draft-${day}.json`}
else if(kind=='j'){data=JSON.stringify({v:1,entries:S.entries},null,1);fn=`soreness-${day}.json`}
else{const r=[['date','workout','part','side','severity','types','note']];S.entries.forEach(e=>active(e.parts).forEach(([k,d])=>r.push([e.date,e.workout,...k.split('.'),d.s,d.t.join('|'),d.n])));
data='\uFEFF'+r.map(x=>x.map(csvCell).join(',')).join('\n');fn=`soreness-${day}.csv`}
try{
 const url=URL.createObjectURL(new Blob([data],{type:kind!=='c'?'application/json;charset=utf-8':'text/csv;charset=utf-8'}));
 const anchor=document.createElement('a');anchor.href=url;anchor.download=fn;document.body.appendChild(anchor);
 try{anchor.click()}finally{anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
}catch{toast(i('nodl'))}}
const H={view:v=>S.view=v,layer:v=>S.layer=v,zoom:v=>S.zoom=+v,tab:v=>S.tab=v,close:()=>S.sel=null,lang:()=>{S.lang=S.lang=='zh'?'en':'zh';sv(LK,S.lang)},rg:v=>S.range=+v,
sev:v=>setP(S.sel,d=>{d.s=+v}),ty:v=>setP(S.sel,d=>{d.t=d.t.includes(v)?d.t.filter(x=>x!=v):[...d.t,v]}),
clr:()=>{S.draft=newDraft();persist()},
save(){const parts=Object.fromEntries(active(S.draft.parts));if(!Object.keys(parts).length)return toast(i('none'));
const e={id:Date.now(),date:S.draft.date,workout:S.draft.workout,parts},entries=[...S.entries,e].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
if(!sv(K,entries)){sv(DK,S.draft);return toast('尚未儲存；草稿已保留，請重試或匯出。 / Not saved; draft retained. Retry or export it.')}
S.entries=entries;S.draft=newDraft();S.sumId=e.id;S.tab='sum';const draftSaved=sv(DK,S.draft);toast(draftSaved?i('saved'):'紀錄已儲存，但舊草稿未能清除，重開頁面可能再次出現。 / Entry saved, but the old draft could not be cleared and may reappear after reload.')},
del(v){if(S.cf!=v){S.cf=v;return}S.entries=S.entries.filter(e=>e.id!=v);S.cf=null;persist()},
exj:()=>{exp('j');return false},exd:()=>{exp('d');return false},exc:()=>{exp('c');return false},imp:()=>{document.getElementById('fi').click();return false}};
document.addEventListener('click',e=>{const k=e.target.closest('[data-k]');if(k&&!e.target.closest('.sheet')){S.sel=k.dataset.k;return render()}
const a=e.target.closest('[data-a]');if(!a)return;const f=H[a.dataset.a];if(f&&f(a.dataset.v)===false)return;render()});
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.matches('g[data-k]')){e.preventDefault();S.sel=e.target.dataset.k;render()}});
document.addEventListener('input',e=>{const id=e.target.id;if(id=='dt')S.draft.date=e.target.value||today();else if(id=='wo')S.draft.workout=e.target.value;else if(id=='nt')setP(S.sel,d=>{d.n=e.target.value});persist()});
document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;
if(id=='sm'){S.sumId=v;render()}else if(id=='tp'){S.tp=v;render()}
else if(id=='fi'&&e.target.files[0]){
 const file=e.target.files[0];e.target.value='';
 if(file.size>10*1024*1024){toast(i('bad'));return}
 const r=new FileReader();r.onerror=()=>toast(i('bad'));
 r.onload=()=>{try{
  const list=parseImport(JSON.parse(r.result)),ids=new Set(S.entries.map(x=>x.id));
  const added=list.filter(x=>!ids.has(x.id));
  S.entries=[...S.entries,...added].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
  const saved=sv(K,S.entries);toast(saved?i('ok'):'匯入內容僅保留於目前頁面，尚未儲存；請匯出備份或重新匯入以重試。 / Import is available only on this page and was not saved. Export a backup or import again to retry.');
 }catch{toast(i('bad'))}};r.readAsText(file)
}});
render();

</script></body></html>
