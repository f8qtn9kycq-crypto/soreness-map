:root[data-theme="dark"]{--bg:#121c1e;--card:#1b2a2d;--ink:#e6eff0;--mut:#9bb0b5;--line:#33484d;--acc:#5fc0c8;--accT:#0b1d20;--sil:#223437}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:12px 14px 120px}
h1{font-size:22px;margin:4px 0}h2{font-size:20px;margin:0 0 4px}
.top,.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mut,label{color:var(--mut);font-size:14px}
label{display:block;margin:8px 0 4px}
button{font:inherit;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:48px;padding:0 14px}
button.pri,button.on{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.4}
.seg{display:flex;gap:6px}.seg button{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
svg.body{width:100%;max-width:340px;display:block;margin:0 auto}
.p{cursor:pointer;stroke:var(--mut);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-dasharray:3 3;fill:var(--card);fill-opacity:.3}
.ro{pointer-events:none}
.p.has{stroke-dasharray:none;stroke:var(--ink);fill-opacity:.92}
g[data-k]:focus-visible{outline:3px solid var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;min-height:58px;background:none;color:var(--mut)}
nav button.on{background:none;color:var(--acc);border-top:3px solid var(--acc)}
.veil{position:fixed;inset:0;background:#0006;z-index:19}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px #0005}
.sev{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.sev button{padding:0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
input,textarea,select{font:inherit;width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);color:var(--ink)}
.rw{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.dot{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#111}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px}
small{color:var(--mut)}

/* Artwork is decorative; interactive positions retain the original record keys. */
.body .art{fill:var(--sil);stroke:var(--mut);stroke-width:1.5;pointer-events:none}
.body .art.head{fill:var(--sil)}
.body .outline{fill:var(--sil);stroke:var(--ink);stroke-width:3;pointer-events:none}
.body .hair{fill:var(--line);stroke:var(--mut);stroke-width:2;pointer-events:none}
.body .hair-lines{fill:none;stroke:var(--mut);stroke-width:1.5;pointer-events:none}
.body .map-hit{fill:transparent;stroke:none;vector-effect:non-scaling-stroke;cursor:pointer}
.body .map-hit.has{fill-opacity:.72;stroke:var(--ink);stroke-width:1}
.body g[data-k]:hover .map-hit:not(.has),.body g[data-k]:focus-visible .map-hit:not(.has){fill:var(--acc);fill-opacity:.18;stroke:var(--acc);stroke-width:1.5}
.body g[data-k]:focus-visible{outline:none}
.body g[data-k]:focus-visible .map-hit{stroke:var(--acc);stroke-width:2}
.map-list{margin:12px 0}.map-list select{background:var(--card)}
.map-candidates{border:2px solid var(--acc)}
button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head>

 }).join('');

function mapCandidates(){const keys=S.mapCandidates.filter(k=>visibleLocations(S.view).includes(k));return keys.length>1?`<div class="card map-candidates" role="group" aria-label="${i('candidateTitle')}"><p role="status">${i('candidateTitle')}</p><div class="chips">${keys.map(k=>`<button data-k="${k}">${name(k)}</button>`).join('')}</div></div>`:''}

return `<div class="seg">${['F','B'].map(v=>`<button data-a="view" data-v="${v}" class="${S.view==v?'on':''}">${i(v=='F'?'front':'back')}</button>`).join('')}</div><div class="seg" style="margin-top:8px">${[['m','muscles'],['j','joints']].map(([v,l])=>`<button data-a="layer" data-v="${v}" class="${S.layer==v?'on':''}">${i(l)}</button>`).join('')}</div><div class="chips">${ZM.map((z,n)=>`<button data-a="zoom" data-v="${n}" class="${S.zoom==n?'on':''}">${i(z[1])}</button>`).join('')}</div><p class="mut">${i('hint')}</p><p class="mut">${i('locationHint')}</p>${locationChoices()}${mapCandidates()}${body(S.view,S.draft.parts,1)}<p class="mut" style="font-size:12px"><a href="THIRD-PARTY-NOTICES.md" style="color:var(--acc)">${i('artCredit')}</a></p>

function trend(){const end=new Date(),t1=new Date(end.getFullYear(),end.getMonth(),end.getDate()).getTime(),t0=new Date(end.getFullYear(),end.getMonth(),end.getDate()-S.range+1).getTime(),X=d=>24+Math.max(0,(new Date(d+'T00:00:00')-t0)/(t1-t0))*290,Y=s=>150-s*13;

const ch=pts.length?`<svg viewBox="0 0 330 185" style="width:100%">${g}${pts.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.s)}" r="6" fill="${p.s?col(p.s):'var(--mut)'}" stroke="var(--ink)"/>`).join('')}<text x="24" y="176" font-size="11" fill="var(--mut)">${new Date(t0).toLocaleDateString('sv-SE').slice(5)}</text><text x="316" y="176" text-anchor="end" font-size="11" fill="var(--mut)">${today().slice(5)}</text></svg>`:`<p class="mut">${i('trendEmpty')}</p>`;
return `<label>${i('part')}</label><select id="tp">${[['muscles',KS.filter(k=>!isJ(k))],['joints',KS.filter(isJ)]].map(([g,a])=>`<optgroup label="${i(g)}">${a.map(k=>`<option value="${k}" ${k==S.tp?'selected':''}>${name(k)}</option>`).join('')}</optgroup>`).join('')}</select>
<div class="seg" style="margin-top:8px">${[7,30,90].map(n=>`<button data-a="rg" data-v="${n}" class="${S.range==n?'on':''}">${n} ${i('days')}</button>`).join('')}</div><div class="card">${ch}<p class="mut">${i('trendHint')}</p></div>
<div class="card"><b>${i('hist')} (${S.entries.length})</b>${[...S.entries].reverse().map(e=>`<div class="rw" style="align-items:center"><div style="flex:1">${e.date} ${esc(e.workout)}<br><small>${active(e.parts).length} ${i('parts')}</small></div><button data-a="del" data-v="${e.id}">${S.cf==e.id?i('cf'):i('del')}</button></div>`).join('')}</div>
${sharePanel()}<div class="card"><b>${i('backup')}</b><p class="mut">${i('backupHint')}</p><div class="row">${S.dl?`<button data-a="exj" style="flex:1">${i('exp')} JSON</button><button data-a="exc" style="flex:1">${i('exp')} CSV</button>`:''}<button data-a="imp" style="flex:1">${i('imp')}</button></div>${S.dl?'':`<p class="mut">${i('nodl')}</p>`}<input type="file" id="fi" accept=".json,application/json" hidden></div>`}
// Unrecorded and legacy zero values are missing observations, never recovery scores.
function trendPoints(entries,part,start,end){return entries.filter(e=>{const time=new Date(e.date+'T00:00:00').getTime(),d=e.parts[part];return time>=start&&time<=end&&d&&Number.isInteger(d.s)&&d.s>0&&d.s<=10}).map(e=>({d:e.date,s:e.parts[part].s}))}
// Sharing is separate from lossless backups. Its controls live only in page memory.
function shareExport(entries,options,lang){
 const {start,end,text}=options;
 if(options.startInvalid||options.endInvalid||(start&&!validDate(start))||(end&&!validDate(end))||(start&&end&&start>end))return {error:'shareInvalid',rows:[],entries:0};
 const rows=[['schema_version','entry_id','part_id','side','part_name','severity','types','date',...(text?['workout','note']:[])]];let count=0;
 for(const e of entries){if((start&&e.date<start)||(end&&e.date>end))continue;const parts=active(e.parts);if(parts.length)count++;

 }

function render(){const focused=document.activeElement,wasSheet=!!(focused&&focused.closest('.sheet')),focusAction=wasSheet?focused.dataset?.a:null,focusValue=wasSheet?focused.dataset?.v:null;const v={rec,trend,sum}[S.tab]();document.documentElement.lang=S.lang=='zh'?'zh-Hant':'en';

function setP(k,f){const d=S.draft.parts[k]||(S.draft.parts[k]={s:0,t:[],n:''});f(d);if(!d.s)delete S.draft.parts[k];persist()}
const csvCell=value=>{let text=String(value);if(/^[\s\uFEFF]*[=+@-]|^[\t\r\n]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"'};
async function exp(kind){const day=today();let data,fn;
if(kind=='d'){data=JSON.stringify({v:1,entries:[{id:Date.now(),date:S.draft.date,workout:S.draft.workout,parts:S.draft.parts}]},null,1);fn=`soreness-draft-${day}.json`}

const H={view:v=>{S.view=v;S.mapCandidates=[]},layer:v=>{S.layer=v;S.mapCandidates=[]},zoom:v=>{S.zoom=+v;S.mapCandidates=[]},tab:v=>S.tab=v,close:()=>S.sel=null,lang:()=>{S.lang=S.lang=='zh'?'en':'zh';sv(LK,S.lang)},rg:v=>S.range=+v,
sev:v=>setP(S.sel,d=>{d.s=+v}),ty:v=>setP(S.sel,d=>{d.t=d.t.includes(v)?d.t.filter(x=>x!=v):[...d.t,v]}),

save(){const parts=Object.fromEntries(active(S.draft.parts));if(!Object.keys(parts).length)return toast(i('none'));
const e={id:Date.now(),date:S.draft.date,workout:S.draft.workout,parts},entries=[...S.entries,e].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);

S.entries=entries;S.draft=newDraft();S.sumId=e.id;S.tab='sum';const draftSaved=sv(DK,S.draft);toast(draftSaved?i('saved'):'紀錄已儲存，但舊草稿未能清除，重開頁面可能再次出現。 / Entry saved, but the old draft could not be cleared and may reappear after reload.')},

exs:()=>{exp('s');return false},exj:()=>{exp('j');return false},exd:()=>{exp('d');return false},exc:()=>{exp('c');return false},imp:()=>{document.getElementById('fi').click();return false}};
document.addEventListener('click',e=>{
