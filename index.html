<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>痠痛記錄 Soreness Map</title><link rel="icon" href="data:,"><link rel="stylesheet" href="assets/freehand.css"></head>
<body><main>
<header><h1 id="title">痠痛記錄</h1><button id="language" type="button">EN</button></header>
<nav id="navigation" aria-label="頁面"><button data-tab="record" type="button">記錄</button><button data-tab="trend" type="button">趨勢</button><button data-tab="history" type="button">總結</button></nav>
<p id="status" role="status" aria-live="polite"></p><div id="storage-warning" role="alert" hidden></div>
<section id="record" aria-labelledby="record-title"><h2 id="record-title" class="sr">畫出痠痛範圍</h2>
<div id="view-controls" class="toolbar"></div>
<p id="draw-hint" class="hint" hidden></p>
<div class="canvas-wrap"><svg id="drawing" role="group" tabindex="0" aria-label="痠痛範圍畫布"></svg><span id="mode-label"></span></div>
<div id="tools" class="toolbar"></div>
<div id="zoom-tools" class="toolbar"></div>

<details id="point-alternative"><summary id="point-title"></summary><p id="point-hint" class="hint"></p><div class="toolbar"><label id="point-x-label" for="point-x"></label><input id="point-x" type="range" min="0" max="100" value="50"><label id="point-y-label" for="point-y"></label><input id="point-y" type="range" min="0" max="100" value="50"></div><button id="add-point" type="button"></button></details>
<div id="stroke-list"></div>
<details><summary id="entry-options-title"></summary><label id="date-label" for="date"></label><input id="date" type="date"><label id="workout-label" for="workout"></label><input id="workout" maxlength="10000"></details>
<div class="toolbar"><button id="save" type="button" class="primary"></button><button id="clear" type="button"></button></div>
<p id="privacy-hint" class="hint"></p><a id="legacy-link" href="legacy.html"></a>
</section>
<section id="history" hidden><h2 id="history-title"></h2><div id="summary-current"></div><div id="history-list"></div><details id="earlier-records"><summary id="legacy-title"></summary><div id="legacy-history"></div></details><details id="backup-options"><summary id="backup-options-title"></summary><section id="backup"><h2 id="backup-title" class="sr"></h2><p id="backup-hint"></p><button id="export-all" type="button" class="primary"></button><label id="import-label" for="import-file"></label><input id="import-file" type="file" accept=".json,application/json"><p id="backup-status" role="status"></p><details><summary id="more-backup-title"></summary><div class="toolbar"><button id="export-draft" type="button"></button><button id="export-old" type="button"></button></div><p><label><input id="csv-text" type="checkbox"><span id="csv-text-label"></span></label></p><button id="export-csv" type="button"></button><p class="hint" id="csv-hint"></p><p id="compatibility-hint" class="hint"></p></details></section></details></section>
<section id="trend" hidden><h2 id="trend-title"></h2><p id="trend-hint" class="hint"></p><div class="toolbar" id="trend-ranges"></div><div id="trend-overview"></div><details id="trend-details"><summary id="trend-details-title"></summary><label id="trend-part-label" for="trend-part"></label><select id="trend-part"></select><div id="trend-results"></div></details><details><summary id="earlier-trend-title"></summary><a id="legacy-trend" href="legacy.html"></a></details></section>

<footer><p id="medical"></p><a href="PRIVACY.md" id="privacy-link"></a> · <a href="THIRD-PARTY-NOTICES.md" id="art-link"></a></footer>
</main>
<section id="editor" aria-labelledby="editor-title" hidden><div class="editor-top"><h2 id="editor-title"></h2><button id="close-editor" type="button"></button></div><label for="severity" id="severity-label"></label><output id="severity-value" for="severity" aria-live="polite"></output><div class="severity-row"><button id="less" type="button" aria-label="降低程度">−</button><input id="severity" type="range" min="0" max="10" step="1" value="7"><button id="more" type="button" aria-label="提高程度">＋</button></div><div class="severity-ends"><span id="zero-label"></span><span id="ten-label"></span></div><details id="stroke-options"><summary id="stroke-options-title"></summary><label id="part-label" for="part"></label><select id="part"></select><label id="note-label" for="note"></label><textarea id="note" maxlength="10000"></textarea></details><button id="remove" type="button"></button></section>
<script src="assets/female-map.js"></script><script src="prototypes/detailed-locations.js"></script><script src="assets/freehand-art.js"></script><script src="assets/freehand-data.js"></script><script src="assets/freehand-location.js"></script><script src="assets/freehand-trend.js"></script><script src="assets/freehand-summary-geometry.js"></script><script src="assets/freehand-summary.js"></script><script src="assets/freehand-anatomy.js"></script><script src="assets/freehand-app.js"></script>
</body></html>
